endpoint:
  get:
    tags:
      - test
    operationId: addAnswer
    parameters:
      - name: testId
        in: path
        description: Идентификатор теста
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './common/schemas.yaml#/AnswerRequest'
    responses:
      200:
        description: OK
      500:
        description: Internal Server Error