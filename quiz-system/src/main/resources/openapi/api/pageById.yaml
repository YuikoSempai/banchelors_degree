endpoint:
  get:
    tags:
      - pages
    operationId: getPageById
    parameters:
      - name: quizId
        in: path
        description: Идентификатор квиза
        required: true
        schema:
          type: integer
          format: int64
      - name: pageId
        in: path
        description: Номер страницы
        required: true
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: OK
        content:
          application/json:
            schema:
              $ref: './common/schemas.yaml#/PageResponse'
      500:
        description: Internal Server Error