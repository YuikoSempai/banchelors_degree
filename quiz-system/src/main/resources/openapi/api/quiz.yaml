endpoint:
  post:
    tags:
      - quiz
    operationId: saveQuiz
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './common/schemas.yaml#/QuizSaveRequest'
    responses:
      200:
        description: OK
        content:
          application/json:
            schema:
              type: integer
              format: int64
      500:
        description: Internal Server Error

  get:
    tags:
      - quiz
    operationId: getQuizzes
    parameters:
      - name: userId
        in: query
        required: false
        schema:
          type: integer
          format: int64
    responses:
      200:
        description: OK
        content:
          application/json:
            schema:
              $ref: './common/schemas.yaml#/QuizzesResponse'
      500:
        description: Internal server error
