QuizSaveRequest:
  type: object
  description: quiz request
  required:
    - name
  properties:
    id:
      description: |
        quiz id
      type: integer
      format: int64
    name:
      description: |
        quiz name
      type: string
      minLength: 1

PageSaveRequest:
  type: object
  description: save page
  required:
    - rawData
    - divKitData
  properties:
    id:
      type: integer
      format: int64
    rawData:
      type: string
    divKitData:
      type: string

QuizzesResponse:
  type: object
  description: all quizzes response
  required:
    - result
  properties:
    result:
      type: array
      items:
        $ref: '#/QuizDto'

RoomDto:
  type: object
  description: information about room
  required:
    - id
    - name
    - users
    - quizNames
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    users:
      type: array
      items:
        type: string
    quizNames:
      type: array
      items:
        type: string


QuizDto:
  type: object
  description: quiz dto from db
  required:
    - id
    - name
    - pageCount
    - available
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    pageCount:
      type: integer
      format: int64
    available:
      type: boolean

PageResponse:
  type: object
  description: page response
  required:
    - quizId
    - pageId
    - divKitData
    - rawData
  properties:
    quizId:
      type: integer
      format: int64
    pageId:
      type: integer
      format: int64
    divKitData:
      type: string
    rawData:
      type: string

QuizResponse:
  type: object
  description: quiz response
  required:
    - id
    - name
    - hasNextPage
  properties:
    id:
      description: |
        quiz identifier
      type: integer
      format: int64
    name:
      description: |
        quiz name
      type: string
      minLength: 1
    frontData:
      description:
      type: string
      minLength: 1
    divKitData:
      description: |
        json string
      type: string
      minLength: 1
    hasNextPage:
      description: |
        hasNextPage param
      type: boolean
    page:
      description: |
        current page num
      type: integer
      format: int64
    pageCount:
      description: |
        quiz pages count
      type: integer
      format: int64

AnswerRequest:
  type: object
  required:
    - pageId
    - answerResult
  properties:
    pageId:
      description: pageId
      type: integer
      format: int64
    answerResult:
      type: boolean
      description: answerResult